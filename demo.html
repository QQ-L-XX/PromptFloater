<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PromptFloater</title>
  <style>
    :root{--bg:#080a0d;--panel:#0d1116;--raised:#121820;--hover:#141c24;--line:#202b35;--line2:#30404c;--cyan:#41f6ff;--magenta:#ff3bd4;--lime:#41f6ff;--lime-soft:rgba(65,246,255,.11);--text:#edf7f8;--text2:#9aabb1;--muted:#627078;--faint:#3d4a51;--danger:#ff5678;--success:#41f6ff;--sans:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;--mono:"Cascadia Code","JetBrains Mono",Consolas,monospace;--fast:120ms ease;--normal:180ms cubic-bezier(.2,.7,.2,1)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:12px/1.45 var(--sans);user-select:none;-webkit-font-smoothing:antialiased}html.snapped-mode,body.snapped-mode{background:transparent!important}
    button,input,textarea,select{font:inherit}
    button{border:0;color:inherit}
    ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#303030;border-radius:4px}
    .app-shell{position:relative;display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 85% 0,rgba(65,246,255,.055),transparent 30%),linear-gradient(155deg,#0b0f14,var(--bg) 58%);border:1px solid #24323b;box-shadow:inset 0 1px rgba(65,246,255,.08)}
    .app-shell::before{content:"";position:absolute;inset:0;z-index:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(65,246,255,.012) 4px);pointer-events:none}.app-shell::after{content:"";position:absolute;z-index:2;left:0;right:0;height:64px;background:linear-gradient(180deg,transparent,rgba(65,246,255,.035),rgba(65,246,255,.09),transparent);mix-blend-mode:screen;opacity:.7;pointer-events:none;animation:deckScan 6s linear infinite}.app-shell>*{position:relative;z-index:1}
    .titlebar{display:flex;align-items:center;min-height:40px;height:40px;padding:0 9px 0 12px;border-bottom:1px solid #22313a;background:linear-gradient(90deg,#0b1015,#0d1117)}
    .titlebar-left,.titlebar-right{display:flex;align-items:center}.titlebar-spacer{flex:1}
    #command-brand{display:flex;align-items:center;gap:8px;font-family:var(--mono)}
    .brand-mark{display:grid;place-items:center;width:25px;height:22px;clip-path:polygon(5px 0,100% 0,100% 17px,20px 100%,0 100%,0 5px);background:linear-gradient(135deg,var(--cyan),var(--magenta));color:#071014;box-shadow:0 0 12px rgba(65,246,255,.2);font-size:10px;font-weight:900;letter-spacing:-.04em;animation:brandPulse 2.8s ease-in-out infinite}
    .brand-name{color:#7e9299;font-size:9px;font-weight:600;letter-spacing:.15em;text-shadow:0 0 8px rgba(65,246,255,.16)}
    .titlebar-right{gap:2px}
    .tb-btn{display:grid;place-items:center;width:28px;height:28px;border-radius:5px;background:transparent;color:#595959;cursor:pointer;transition:color var(--fast),background var(--fast)}
    .tb-btn:hover,.tb-btn:focus-visible{background:#1a1a1a;color:var(--text2);outline:none}.tb-btn.pinned{color:var(--lime)}
    #app{display:flex;flex:1;min-height:0;flex-direction:column}
    #command-search{padding:10px 12px 8px}
    .search-wrapper{position:relative;display:flex;align-items:center;height:38px;border:1px solid #30404c;border-radius:3px;background:rgba(8,13,18,.92);box-shadow:inset 2px 0 var(--cyan);transition:border var(--normal),box-shadow var(--normal)}
    .search-wrapper:focus-within{border-color:#3c7480;box-shadow:inset 2px 0 var(--cyan),0 0 0 2px rgba(65,246,255,.045),0 0 18px rgba(65,246,255,.07)}
    .search-prefix{padding-left:11px;color:var(--cyan);font:600 12px var(--mono);text-shadow:0 0 8px rgba(65,246,255,.7)}
    #search-input{width:100%;height:100%;border:0;outline:0;background:transparent;padding:0 34px 0 8px;color:var(--text);font:11px var(--mono)}
    #search-input::placeholder{color:#555}
    .search-clear{position:absolute;right:4px;display:grid;place-items:center;width:28px;height:28px;border-radius:4px;background:transparent;color:#555;cursor:pointer}.search-clear:hover{background:#202020;color:#aaa}
    .category-nav{display:flex;gap:16px;min-height:35px;padding:0 13px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}.category-nav::-webkit-scrollbar{display:none}
    .cat-tab{position:relative;flex:none;height:35px;background:transparent;color:#68777d;cursor:pointer;font:9.5px var(--mono);letter-spacing:.035em;white-space:nowrap;transition:color var(--fast)}
    .cat-tab:hover{color:#aaa}.cat-tab.active{color:var(--cyan)}.cat-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,var(--cyan),var(--magenta));box-shadow:0 0 8px rgba(65,246,255,.45)}
    .cat-badge{margin-left:5px;color:#445159}.cat-tab.active .cat-badge{color:#4db9c3}
    .items-container{flex:1;min-height:0;overflow-y:auto;padding:5px 8px 8px}
    .prompt-item{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"index title actions" "index summary actions";column-gap:8px;min-height:58px;margin:1px 0;padding:9px 9px 8px 5px;border:1px solid transparent;border-radius:7px;cursor:pointer;transition:background var(--fast),border var(--fast)}
    .prompt-item::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:transparent}
    .prompt-item:hover{background:#0f151b;border-color:#1d2a32}.prompt-item.selected{background:linear-gradient(90deg,rgba(65,246,255,.07),var(--raised) 36%,rgba(255,59,212,.025));border-color:#25414a;box-shadow:inset 0 1px rgba(65,246,255,.035)}.prompt-item.selected::before{background:var(--cyan);box-shadow:0 0 9px rgba(65,246,255,.58)}
    .prompt-item.copied{background:var(--lime-soft);border-color:#27515a}.prompt-item.copied::before{background:var(--cyan)}
    .item-index{grid-area:index;align-self:start;padding-top:1px;color:#494949;text-align:right;font:9px var(--mono)}
    .item-title{grid-area:title;overflow:hidden;color:#dce5e7;font:500 11.5px var(--mono);text-overflow:ellipsis;white-space:nowrap}.prompt-item.selected .item-title{color:#fff}
    .item-summary{grid-area:summary;overflow:hidden;margin-top:4px;color:#6f7c81;font-size:10.5px;text-overflow:ellipsis;white-space:nowrap}.prompt-item.selected .item-summary{color:#98a6aa}
    .item-actions{grid-area:actions;display:flex;align-items:center;gap:1px;opacity:.45;transition:opacity var(--fast)}.prompt-item:hover .item-actions,.prompt-item.selected .item-actions{opacity:1}
    .item-shortcut{align-self:center;margin-right:4px;color:#56636a;font:8px var(--mono)}.prompt-item.selected .item-shortcut{color:#55c7d0}
    .item-copy-state{display:none;color:var(--lime);font:700 8px var(--mono);letter-spacing:.05em;white-space:nowrap}.prompt-item.copied .item-copy-state{display:inline}.prompt-item.copied .item-shortcut,.prompt-item.copied .item-action-btn{display:none}
    .item-action-btn{display:grid;place-items:center;width:23px;height:23px;border-radius:4px;background:transparent;color:#595959;cursor:pointer}.item-action-btn:hover{background:#242424;color:#bbb}.fav-active{color:var(--lime)!important}.delete-btn:hover{color:var(--danger)}
    .empty-state{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;color:#4d4d4d}.empty-state.hidden,.hidden{display:none!important}.empty-icon{font:22px var(--mono)}.empty-title{margin-top:8px;font:10px var(--mono)}.empty-desc{margin-top:4px;font-size:10px;color:#383838}
    #command-status{position:relative;display:flex;align-items:center;min-height:38px;height:38px;padding:0 9px;border-top:1px solid #22313a;background:#0a0f14;color:#65767d;font:9px var(--mono)}
    .status-actions{display:flex;align-items:center;gap:10px}.status-action{background:transparent;color:#666;cursor:pointer;font:8.5px var(--mono)}.status-action:hover{color:var(--text)}.key{color:var(--lime);font-weight:700}.status-spacer{flex:1}#result-count{color:#555}
    .codex-usage{display:flex;align-items:center;gap:4px;height:25px;max-width:74px;margin-left:8px;padding:0 6px;border:1px solid #25404a;border-radius:2px;background:#0b1418;color:#71848a;cursor:pointer;font:8.5px var(--mono);white-space:nowrap;overflow:hidden;box-shadow:inset 2px 0 var(--cyan)}.codex-usage:hover{border-color:#39707b;color:#adc1c4;box-shadow:inset 2px 0 var(--cyan),0 0 12px rgba(65,246,255,.1)}.codex-usage strong{color:var(--cyan);font-weight:700}.codex-usage.warn{border-color:#56451c;background:#181306;box-shadow:inset 2px 0 #ffd36b}.codex-usage.warn strong{color:#ffd36b}.codex-usage.hot{border-color:#5b2222;background:#180d0d;box-shadow:inset 2px 0 var(--danger)}.codex-usage.hot strong{color:var(--danger)}
    #btn-tools{display:grid;place-items:center;width:27px;height:25px;margin-left:7px;border-radius:4px;background:transparent;color:#777;cursor:pointer;font:bold 13px var(--mono)}#btn-tools:hover,#btn-tools.active{background:#202020;color:var(--lime)}
    #tools-menu{position:absolute;right:8px;bottom:34px;z-index:60;width:136px;padding:5px;border:1px solid var(--line2);border-radius:7px;background:#151515;box-shadow:0 14px 40px #000b}
    .tool-item{display:flex;width:100%;align-items:center;gap:9px;padding:8px 9px;border-radius:4px;background:transparent;color:#999;cursor:pointer;text-align:left;font:9px var(--mono)}.tool-item:hover{background:#222;color:var(--text)}.tool-item span{color:var(--lime)}
    .modal-backdrop,.quit-modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#000c;backdrop-filter:blur(4px)}
    .modal-panel,.quit-dialog{width:calc(100% - 30px);max-width:370px;overflow:hidden;border:1px solid var(--line2);border-radius:10px;background:#141414;box-shadow:0 20px 70px #000}.modal-panel{display:flex;max-height:calc(100% - 16px);flex-direction:column}
    .modal-header{display:flex;align-items:center;justify-content:space-between;height:42px;padding:0 14px;border-bottom:1px solid var(--line)}.modal-header h3{font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .modal-close{display:grid;place-items:center;width:26px;height:26px;border-radius:4px;background:transparent;color:#666;cursor:pointer}.modal-close:hover{background:#242424;color:#bbb}
    .modal-body{display:flex;min-height:0;flex:1;flex-direction:column;gap:8px;overflow-y:auto;padding:14px}.form-label{margin-top:3px;color:#728087;font:8.5px var(--mono);letter-spacing:.1em;text-transform:uppercase}
    .form-select,.form-textarea,.cat-name-input{border:1px solid var(--line2);border-radius:6px;outline:none;background:#0b1015;color:var(--text);font-size:11px}.form-select{height:34px;padding:0 9px}.form-textarea{min-height:110px;padding:9px;resize:vertical;line-height:1.55}.form-select:focus,.form-textarea:focus,.cat-name-input:focus{border-color:#35727c;box-shadow:0 0 0 3px rgba(65,246,255,.045)}
    .modal-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}.modal-footer-right{display:flex;gap:6px;margin-left:auto}
    .btn-primary,.btn-secondary,.btn-ghost{padding:7px 12px;border-radius:5px;cursor:pointer;font:9px var(--mono)}.btn-primary{background:var(--lime);color:#101207;font-weight:700}.btn-secondary{border:1px solid var(--line2);background:#181818;color:#aaa}.btn-ghost{background:transparent;color:#777}.btn-ghost:hover{background:#222;color:#ddd}.btn-danger{color:var(--danger)}
    .cat-list-item{display:flex;align-items:center;gap:7px;padding:5px}.cat-name-input{flex:1;height:32px;padding:0 8px}.cat-del-btn{width:25px;height:25px;border-radius:4px;background:transparent;color:#555;cursor:pointer}.cat-del-btn:hover{background:#2a1b1b;color:var(--danger)}
    .toast{position:fixed;left:50%;bottom:48px;z-index:200;display:flex;max-width:calc(100% - 16px);gap:7px;align-items:center;transform:translateX(-50%);padding:7px 13px;border:1px solid #28545d;border-radius:4px;background:#0c171b;color:#9eeff3;box-shadow:0 0 22px rgba(65,246,255,.12),0 10px 35px #000;font:9px var(--mono);white-space:nowrap}.toast #toast-msg{overflow:hidden;text-overflow:ellipsis}
    .tt-desc{position:fixed;z-index:90;max-width:240px;padding:7px 9px;border:1px solid var(--line2);border-radius:5px;background:#151515;color:#aaa;opacity:0;pointer-events:none;font-size:10px;transition:opacity var(--fast)}.tt-desc.on{opacity:1}
    .quit-dialog{width:260px;padding:18px;text-align:center}.quit-dialog p{margin-bottom:15px;color:#aaa}.quit-btns{display:flex;justify-content:center;gap:7px}.quit-btns button{padding:7px 18px;border-radius:5px;cursor:pointer}.quit-btn-no{border:1px solid var(--line2);background:#171717;color:#888}.quit-btn-yes{background:var(--danger);color:#fff}
    .resize-handle{position:absolute;right:2px;bottom:1px;z-index:70;width:13px;height:13px;color:#444;cursor:nwse-resize}
    .snapped-indicator{--snap-accent:var(--cyan);position:relative;display:none;width:64px;height:64px;cursor:pointer;filter:drop-shadow(0 8px 12px #000b)}.snap-aura{position:absolute;inset:7px;border-radius:50%;background:var(--snap-accent);opacity:.13;filter:blur(9px);animation:holoBreath 2.2s ease-in-out infinite;pointer-events:none}.snap-orbit{position:absolute;inset:4px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0 18%,var(--snap-accent) 24% 31%,transparent 38% 61%,var(--magenta) 68% 73%,transparent 80%);animation:holoSpin 3.6s linear infinite;pointer-events:none}.snap-orbit::after{content:"";position:absolute;inset:3px;border-radius:50%;background:#080b0f}.snap-frame{position:absolute;inset:9px;clip-path:polygon(25% 2%,75% 2%,98% 25%,98% 75%,75% 98%,25% 98%,2% 75%,2% 25%);background:linear-gradient(135deg,var(--snap-accent),#1f5060 45%,var(--magenta));padding:1px;animation:corePulse 2.2s ease-in-out infinite}.snap-core{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;clip-path:inherit;background:radial-gradient(circle at 50% 35%,#132630,#080c11 68%);color:var(--snap-accent);font-family:var(--mono);line-height:1}.snap-core::before{content:"";position:absolute;left:0;right:0;height:8px;background:linear-gradient(180deg,transparent,rgba(65,246,255,.28),transparent);animation:holoScan 1.65s linear infinite}.snap-core::after{content:"";position:absolute;inset:3px;border:1px solid rgba(65,246,255,.12);clip-path:inherit}.snap-label{z-index:1;margin-bottom:4px;color:#7b9ba2;font-size:6px;font-weight:800;letter-spacing:.18em;text-shadow:0 0 5px var(--snap-accent)}.snap-value{z-index:1;font-size:12px;font-weight:900;letter-spacing:-.06em;text-shadow:0 0 8px var(--snap-accent)}.snap-tick{position:absolute;z-index:2;width:3px;height:3px;background:var(--snap-accent);box-shadow:0 0 5px var(--snap-accent);animation:tickBlink 1.2s steps(2,end) infinite}.snap-tick.t1{top:7px;left:30px}.snap-tick.t2{right:7px;top:30px;animation-delay:.4s}.snap-tick.t3{bottom:7px;left:30px;animation-delay:.8s}.snapped-indicator.warn{--snap-accent:#ffd36b}.snapped-indicator.hot{--snap-accent:var(--danger)}
    @keyframes deckScan{from{top:-70px}to{top:100%}}@keyframes brandPulse{0%,100%{filter:brightness(.9);box-shadow:0 0 5px rgba(65,246,255,.12)}50%{filter:brightness(1.18);box-shadow:0 0 15px rgba(65,246,255,.42)}}@keyframes holoBreath{0%,100%{opacity:.08;transform:scale(.88)}50%{opacity:.34;transform:scale(1.14)}}@keyframes holoSpin{to{transform:rotate(360deg)}}@keyframes holoScan{from{top:-10px}to{top:100%}}@keyframes corePulse{0%,100%{filter:brightness(.86)}50%{filter:brightness(1.2)}}@keyframes tickBlink{0%,35%{opacity:.2}36%,100%{opacity:1}}
    @media (max-width:380px){#result-count{display:none}#command-status{padding-inline:6px}.status-actions{gap:6px}.status-actions,.status-action{font-size:8px}.codex-usage{margin-left:4px;padding-inline:5px}#btn-tools{margin-left:2px}}
    @media (max-width:320px){.titlebar{padding-inline:7px 5px}#command-brand{gap:5px}.brand-name{display:inline;font-size:7.5px;letter-spacing:.08em}.titlebar-right{gap:0}.tb-btn{width:26px}#command-search{padding:7px 8px 6px}.category-nav{gap:12px;padding:0 9px}.items-container{padding-inline:5px}.prompt-item{grid-template-columns:24px minmax(0,1fr) auto;padding-right:5px;column-gap:6px}.status-actions{gap:4px}.status-actions,.status-action{font-size:7.5px}.codex-usage{max-width:68px}.modal-panel{width:calc(100% - 16px)}}
    @media (max-height:260px){.titlebar{min-height:34px;height:34px}#command-search{padding-block:5px}.search-wrapper{height:32px}.category-nav,.cat-tab{min-height:29px;height:29px}.prompt-item{min-height:48px;padding-block:6px}#command-status{min-height:34px;height:34px}.item-summary{margin-top:2px}.empty-icon{font-size:17px}.empty-title{margin-top:4px}}
    @media (prefers-reduced-motion:reduce){.app-shell::after,.brand-mark,.snap-aura,.snap-orbit,.snap-frame,.snap-core::before,.snap-tick{animation:none!important}}
    .app-shell.snapped{display:flex!important;align-items:center!important;justify-content:center!important;overflow:visible!important;border:0!important;background:transparent!important;box-shadow:none!important}.app-shell.snapped::before,.app-shell.snapped::after{display:none!important}.app-shell.snapped #app,.app-shell.snapped .titlebar,.app-shell.snapped .resize-handle{display:none!important}.app-shell.snapped .snapped-indicator{display:block}
  </style>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="titlebar">
      <div class="titlebar-left" id="command-brand"><span class="brand-mark">PF</span><span class="brand-name">COMMAND DECK</span></div>
      <div class="titlebar-spacer"></div>
      <div class="titlebar-right">
        <button class="tb-btn" id="btn-snap" aria-label="贴边" title="贴边"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M15 4v16"/></svg></button>
        <button class="tb-btn" id="btn-pin" aria-label="固定" title="固定"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3v2H7v-2l3-3-1-6zM12 15v6"/></svg></button>
        <button class="tb-btn" id="btn-quit" aria-label="退出" title="退出"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>
    </header>
    <div class="snapped-indicator" id="snapped-indicator" title="Codex 剩余用量"><span class="snap-aura"></span><span class="snap-orbit"></span><span class="snap-tick t1"></span><span class="snap-tick t2"></span><span class="snap-tick t3"></span><div class="snap-frame"><div class="snap-core"><span class="snap-label">CDX</span><span class="snap-value" id="snap-usage">--</span></div></div></div>
    <main id="app">
      <section id="command-search"><div class="search-wrapper"><span class="search-prefix">/</span><input type="text" id="search-input" aria-label="搜索提示词" placeholder="搜索或输入快捷指令"><button class="search-clear hidden" id="search-clear" aria-label="清空搜索"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div></section>
      <nav class="category-nav" id="category-nav" aria-label="提示词分类"></nav>
      <section class="items-container" id="items-container"></section>
      <div class="empty-state hidden" id="empty-state"><span class="empty-icon">[ ]</span><p class="empty-title">NO PROMPTS</p><p class="empty-desc">按 N 新建第一条提示词</p></div>
      <div class="empty-state hidden" id="no-results"><span class="empty-icon">[?]</span><p class="empty-title">NO MATCH</p></div>
      <footer id="command-status">
        <div class="status-actions"><button class="status-action" id="btn-add-item"><span class="key">N</span> NEW</button><button class="status-action" id="btn-edit-selected"><span class="key">E</span> EDIT</button><button class="status-action" id="btn-fav-selected"><span class="key">F</span> FAV</button></div>
        <div class="status-spacer"></div><span id="result-count">0 / 0</span><button class="codex-usage" id="codex-usage" aria-label="刷新 Codex 用量" title="点击刷新 Codex 用量"><strong>CDX</strong><span id="codex-usage-text">--</span></button>
        <button id="btn-tools" aria-label="更多工具" title="更多工具"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button>
        <div id="tools-menu" class="hidden">
          <button class="tool-item" id="btn-codex-usage" data-tool="codex-usage"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5m5 14V9m5 10V3m5 16v-7"/></svg></span> CODEX USAGE</button>
          <button class="tool-item" id="btn-export" data-tool="export"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m-4 4 4-4 4 4M5 14v5h14v-5"/></svg></span> EXPORT</button>
          <button class="tool-item" id="btn-import" data-tool="import"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m-4-4 4 4 4-4M5 18v2h14v-2"/></svg></span> IMPORT</button>
          <button class="tool-item" id="btn-manage" data-tool="categories"><span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 6h14M5 12h14M5 18h14"/></svg></span> CATEGORIES</button>
        </div>
      </footer>
    </main>
    <div class="resize-handle" id="resize-handle"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 9v11H9M20 14l-6 6"/></svg></div>
  </div>

  <div class="modal-backdrop hidden" id="modal-item"><div class="modal-panel"><div class="modal-header"><h3 id="modal-item-title">NEW PROMPT</h3><button class="modal-close" id="modal-item-close" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="modal-body"><label class="form-label" for="modal-item-category">Category</label><select id="modal-item-category" class="form-select"></select><label class="form-label" for="modal-item-content">Content</label><textarea id="modal-item-content" class="form-textarea" rows="5" placeholder="Paste prompt here..."></textarea></div><div class="modal-footer"><button class="btn-ghost btn-danger hidden" id="modal-item-delete">DELETE</button><div class="modal-footer-right"><button class="btn-ghost" id="modal-item-cancel">CANCEL</button><button class="btn-primary" id="modal-item-save">SAVE</button></div></div></div></div>
  <div class="modal-backdrop hidden" id="modal-manage"><div class="modal-panel"><div class="modal-header"><h3>MANAGE CATEGORIES</h3><button class="modal-close" id="modal-manage-close" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="modal-body" id="category-list-body"></div><div class="modal-footer"><button class="btn-secondary" id="btn-add-category">＋ ADD</button><button class="btn-primary" id="modal-manage-done">DONE</button></div></div></div>
  <div class="toast hidden" id="toast"><span id="toast-icon"></span><span id="toast-msg"></span></div>
  <div class="tt-desc" id="tt-desc"></div>
  <div class="quit-modal hidden" id="quit-modal"><div class="quit-dialog"><p>确定退出 PromptFloater？</p><div class="quit-btns"><button class="quit-btn-no" id="quit-no">取消</button><button class="quit-btn-yes" id="quit-yes">退出</button></div></div></div>
  <script src="renderer/app.js"></script>
</body>
</html>
