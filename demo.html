<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PromptFloater</title>
  <style>
    :root{--bg:#0b0b0b;--panel:#111;--raised:#171717;--hover:#1c1c1c;--line:#292929;--line2:#383838;--lime:#d6ff62;--lime-soft:rgba(214,255,98,.11);--text:#ededed;--text2:#a1a1a1;--muted:#686868;--faint:#454545;--danger:#ef7777;--success:#d6ff62;--sans:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;--mono:"Cascadia Code","JetBrains Mono",Consolas,monospace;--fast:120ms ease;--normal:180ms cubic-bezier(.2,.7,.2,1)}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:12px/1.45 var(--sans);user-select:none;-webkit-font-smoothing:antialiased}
    button,input,textarea,select{font:inherit}
    button{border:0;color:inherit}
    ::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#303030;border-radius:4px}
    .app-shell{position:relative;display:flex;flex-direction:column;width:100%;height:100%;overflow:hidden;background:var(--bg);border:1px solid #202020}
    .titlebar{display:flex;align-items:center;min-height:40px;height:40px;padding:0 9px 0 12px;border-bottom:1px solid var(--line);background:#0e0e0e}
    .titlebar-left,.titlebar-right{display:flex;align-items:center}.titlebar-spacer{flex:1}
    #command-brand{display:flex;align-items:center;gap:8px;font-family:var(--mono)}
    .brand-mark{display:grid;place-items:center;width:24px;height:22px;border-radius:4px;background:var(--lime);color:#101207;font-size:10px;font-weight:800;letter-spacing:-.04em}
    .brand-name{color:#858585;font-size:9px;font-weight:600;letter-spacing:.15em}
    .titlebar-right{gap:2px}
    .tb-btn{display:grid;place-items:center;width:28px;height:28px;border-radius:5px;background:transparent;color:#595959;cursor:pointer;transition:color var(--fast),background var(--fast)}
    .tb-btn:hover,.tb-btn:focus-visible{background:#1a1a1a;color:var(--text2);outline:none}.tb-btn.pinned{color:var(--lime)}
    #app{display:flex;flex:1;min-height:0;flex-direction:column}
    #command-search{padding:10px 12px 8px}
    .search-wrapper{position:relative;display:flex;align-items:center;height:38px;border:1px solid var(--line2);border-radius:7px;background:#131313;transition:border var(--normal),box-shadow var(--normal)}
    .search-wrapper:focus-within{border-color:#596a2e;box-shadow:0 0 0 3px rgba(214,255,98,.05)}
    .search-prefix{padding-left:11px;color:var(--lime);font:600 12px var(--mono)}
    #search-input{width:100%;height:100%;border:0;outline:0;background:transparent;padding:0 34px 0 8px;color:var(--text);font:11px var(--mono)}
    #search-input::placeholder{color:#555}
    .search-clear{position:absolute;right:4px;display:grid;place-items:center;width:28px;height:28px;border-radius:4px;background:transparent;color:#555;cursor:pointer}.search-clear:hover{background:#202020;color:#aaa}
    .category-nav{display:flex;gap:16px;min-height:35px;padding:0 13px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}.category-nav::-webkit-scrollbar{display:none}
    .cat-tab{position:relative;flex:none;height:35px;background:transparent;color:#666;cursor:pointer;font:9px var(--mono);letter-spacing:.04em;white-space:nowrap;transition:color var(--fast)}
    .cat-tab:hover{color:#aaa}.cat-tab.active{color:var(--lime)}.cat-tab.active::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--lime);box-shadow:0 0 8px rgba(214,255,98,.4)}
    .cat-badge{margin-left:5px;color:#444}.cat-tab.active .cat-badge{color:#81983e}
    .items-container{flex:1;min-height:0;overflow-y:auto;padding:5px 8px 8px}
    .prompt-item{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;grid-template-areas:"index title actions" "index summary actions";column-gap:8px;min-height:58px;margin:1px 0;padding:9px 9px 8px 5px;border:1px solid transparent;border-radius:7px;cursor:pointer;transition:background var(--fast),border var(--fast)}
    .prompt-item::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:transparent}
    .prompt-item:hover{background:#151515}.prompt-item.selected{background:var(--raised);border-color:#262b1d}.prompt-item.selected::before{background:var(--lime);box-shadow:0 0 8px rgba(214,255,98,.28)}
    .prompt-item.copied{background:var(--lime-soft);border-color:#3f4a22}.prompt-item.copied::before{background:var(--lime)}
    .item-index{grid-area:index;align-self:start;padding-top:1px;color:#494949;text-align:right;font:9px var(--mono)}
    .item-title{grid-area:title;overflow:hidden;color:#d8d8d8;font:500 10.5px var(--mono);text-overflow:ellipsis;white-space:nowrap}.prompt-item.selected .item-title{color:#fff}
    .item-summary{grid-area:summary;overflow:hidden;margin-top:4px;color:#666;font-size:10px;text-overflow:ellipsis;white-space:nowrap}.prompt-item.selected .item-summary{color:#898989}
    .item-actions{grid-area:actions;display:flex;align-items:center;gap:1px;opacity:.45;transition:opacity var(--fast)}.prompt-item:hover .item-actions,.prompt-item.selected .item-actions{opacity:1}
    .item-shortcut{align-self:center;margin-right:4px;color:#555;font:8px var(--mono)}.prompt-item.selected .item-shortcut{color:#879f44}
    .item-action-btn{display:grid;place-items:center;width:23px;height:23px;border-radius:4px;background:transparent;color:#595959;cursor:pointer}.item-action-btn:hover{background:#242424;color:#bbb}.fav-active{color:var(--lime)!important}.delete-btn:hover{color:var(--danger)}
    .empty-state{display:flex;flex:1;flex-direction:column;align-items:center;justify-content:center;color:#4d4d4d}.empty-state.hidden,.hidden{display:none!important}.empty-icon{font:22px var(--mono)}.empty-title{margin-top:8px;font:10px var(--mono)}.empty-desc{margin-top:4px;font-size:10px;color:#383838}
    #command-status{position:relative;display:flex;align-items:center;min-height:38px;height:38px;padding:0 9px;border-top:1px solid var(--line);background:#0e0e0e;color:#5c5c5c;font:8.5px var(--mono)}
    .status-actions{display:flex;align-items:center;gap:10px}.status-action{background:transparent;color:#666;cursor:pointer;font:8.5px var(--mono)}.status-action:hover{color:var(--text)}.key{color:var(--lime);font-weight:700}.status-spacer{flex:1}#result-count{color:#555}
    #btn-tools{display:grid;place-items:center;width:27px;height:25px;margin-left:7px;border-radius:4px;background:transparent;color:#777;cursor:pointer;font:bold 13px var(--mono)}#btn-tools:hover,#btn-tools.active{background:#202020;color:var(--lime)}
    #tools-menu{position:absolute;right:8px;bottom:34px;z-index:60;width:136px;padding:5px;border:1px solid var(--line2);border-radius:7px;background:#151515;box-shadow:0 14px 40px #000b}
    .tool-item{display:flex;width:100%;align-items:center;gap:9px;padding:8px 9px;border-radius:4px;background:transparent;color:#999;cursor:pointer;text-align:left;font:9px var(--mono)}.tool-item:hover{background:#222;color:var(--text)}.tool-item span{color:var(--lime)}
    .modal-backdrop,.quit-modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:#000c;backdrop-filter:blur(4px)}
    .modal-panel,.quit-dialog{width:calc(100% - 30px);max-width:370px;overflow:hidden;border:1px solid var(--line2);border-radius:10px;background:#141414;box-shadow:0 20px 70px #000}
    .modal-header{display:flex;align-items:center;justify-content:space-between;height:42px;padding:0 14px;border-bottom:1px solid var(--line)}.modal-header h3{font:10px var(--mono);letter-spacing:.08em;text-transform:uppercase}
    .modal-close{display:grid;place-items:center;width:26px;height:26px;border-radius:4px;background:transparent;color:#666;cursor:pointer}.modal-close:hover{background:#242424;color:#bbb}
    .modal-body{display:flex;max-height:350px;flex-direction:column;gap:8px;overflow-y:auto;padding:14px}.form-label{margin-top:3px;color:#666;font:8px var(--mono);letter-spacing:.1em;text-transform:uppercase}
    .form-select,.form-textarea,.cat-name-input{border:1px solid var(--line2);border-radius:6px;outline:none;background:#0d0d0d;color:var(--text);font-size:11px}.form-select{height:34px;padding:0 9px}.form-textarea{min-height:110px;padding:9px;resize:vertical;line-height:1.55}.form-select:focus,.form-textarea:focus,.cat-name-input:focus{border-color:#596a2e;box-shadow:0 0 0 3px rgba(214,255,98,.04)}
    .modal-footer{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}.modal-footer-right{display:flex;gap:6px;margin-left:auto}
    .btn-primary,.btn-secondary,.btn-ghost{padding:7px 12px;border-radius:5px;cursor:pointer;font:9px var(--mono)}.btn-primary{background:var(--lime);color:#101207;font-weight:700}.btn-secondary{border:1px solid var(--line2);background:#181818;color:#aaa}.btn-ghost{background:transparent;color:#777}.btn-ghost:hover{background:#222;color:#ddd}.btn-danger{color:var(--danger)}
    .cat-list-item{display:flex;align-items:center;gap:7px;padding:5px}.cat-name-input{flex:1;height:32px;padding:0 8px}.cat-del-btn{width:25px;height:25px;border-radius:4px;background:transparent;color:#555;cursor:pointer}.cat-del-btn:hover{background:#2a1b1b;color:var(--danger)}
    .toast{position:fixed;left:50%;bottom:48px;z-index:200;display:flex;gap:7px;align-items:center;transform:translateX(-50%);padding:7px 13px;border:1px solid #465326;border-radius:6px;background:#161a0f;color:#cfe990;box-shadow:0 10px 35px #000;font:9px var(--mono)}
    .tt-desc{position:fixed;z-index:90;max-width:240px;padding:7px 9px;border:1px solid var(--line2);border-radius:5px;background:#151515;color:#aaa;opacity:0;pointer-events:none;font-size:10px;transition:opacity var(--fast)}.tt-desc.on{opacity:1}
    .quit-dialog{width:260px;padding:18px;text-align:center}.quit-dialog p{margin-bottom:15px;color:#aaa}.quit-btns{display:flex;justify-content:center;gap:7px}.quit-btns button{padding:7px 18px;border-radius:5px;cursor:pointer}.quit-btn-no{border:1px solid var(--line2);background:#171717;color:#888}.quit-btn-yes{background:var(--danger);color:#fff}
    .resize-handle{position:absolute;right:2px;bottom:1px;z-index:70;width:13px;height:13px;color:#444;cursor:nwse-resize}
    .snapped-indicator{display:none;width:28px;height:28px;cursor:pointer}.snap-core{display:grid;place-items:center;width:28px;height:28px;clip-path:polygon(25% 6%,75% 6%,100% 50%,75% 94%,25% 94%,0 50%);background:var(--lime);color:#101207;font:bold 8px var(--mono);filter:drop-shadow(0 0 7px rgba(214,255,98,.35));animation:snapPulse 2.4s ease-in-out infinite}@keyframes snapPulse{50%{filter:drop-shadow(0 0 12px rgba(214,255,98,.65));transform:scale(1.06)}}
    .app-shell.snapped{display:flex!important;align-items:center!important;justify-content:center!important;overflow:visible!important;border:0!important;background:transparent!important}.app-shell.snapped #app,.app-shell.snapped .titlebar,.app-shell.snapped .resize-handle{display:none!important}.app-shell.snapped .snapped-indicator{display:block}
  </style>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <header class="titlebar">
      <div class="titlebar-left" id="command-brand"><span class="brand-mark">PF</span><span class="brand-name">COMMAND DECK</span></div>
      <div class="titlebar-spacer"></div>
      <div class="titlebar-right">
        <button class="tb-btn" id="btn-snap" aria-label="贴边" title="贴边">◫</button>
        <button class="tb-btn" id="btn-pin" aria-label="固定" title="固定">⌖</button>
        <button class="tb-btn" id="btn-quit" aria-label="退出" title="退出">×</button>
      </div>
    </header>
    <div class="snapped-indicator" id="snapped-indicator"><div class="snap-core">PF</div></div>
    <main id="app">
      <section id="command-search"><div class="search-wrapper"><span class="search-prefix">/</span><input type="text" id="search-input" aria-label="搜索提示词" placeholder="搜索或输入快捷指令"><button class="search-clear hidden" id="search-clear" aria-label="清空搜索">×</button></div></section>
      <nav class="category-nav" id="category-nav" aria-label="提示词分类"></nav>
      <section class="items-container" id="items-container"></section>
      <div class="empty-state hidden" id="empty-state"><span class="empty-icon">[ ]</span><p class="empty-title">NO PROMPTS</p><p class="empty-desc">按 N 新建第一条提示词</p></div>
      <div class="empty-state hidden" id="no-results"><span class="empty-icon">[?]</span><p class="empty-title">NO MATCH</p></div>
      <footer id="command-status">
        <div class="status-actions"><button class="status-action" id="btn-add-item"><span class="key">N</span> NEW</button><span><span class="key">E</span> EDIT</span><span><span class="key">F</span> FAV</span></div>
        <div class="status-spacer"></div><span id="result-count">0 / 0</span>
        <button id="btn-tools" aria-label="更多工具" title="更多工具">···</button>
        <div id="tools-menu" class="hidden">
          <button class="tool-item" id="btn-export" data-tool="export"><span>⇧</span> EXPORT</button>
          <button class="tool-item" id="btn-import" data-tool="import"><span>⇩</span> IMPORT</button>
          <button class="tool-item" id="btn-manage" data-tool="categories"><span>⌘</span> CATEGORIES</button>
        </div>
      </footer>
    </main>
    <div class="resize-handle" id="resize-handle">⌟</div>
  </div>

  <div class="modal-backdrop hidden" id="modal-item"><div class="modal-panel"><div class="modal-header"><h3 id="modal-item-title">NEW PROMPT</h3><button class="modal-close" id="modal-item-close" aria-label="关闭">×</button></div><div class="modal-body"><label class="form-label" for="modal-item-category">Category</label><select id="modal-item-category" class="form-select"></select><label class="form-label" for="modal-item-content">Content</label><textarea id="modal-item-content" class="form-textarea" rows="5" placeholder="Paste prompt here..."></textarea></div><div class="modal-footer"><button class="btn-ghost btn-danger hidden" id="modal-item-delete">DELETE</button><div class="modal-footer-right"><button class="btn-ghost" id="modal-item-cancel">CANCEL</button><button class="btn-primary" id="modal-item-save">SAVE</button></div></div></div></div>
  <div class="modal-backdrop hidden" id="modal-manage"><div class="modal-panel"><div class="modal-header"><h3>MANAGE CATEGORIES</h3><button class="modal-close" id="modal-manage-close" aria-label="关闭">×</button></div><div class="modal-body" id="category-list-body"></div><div class="modal-footer"><button class="btn-secondary" id="btn-add-category">＋ ADD</button><button class="btn-primary" id="modal-manage-done">DONE</button></div></div></div>
  <div class="toast hidden" id="toast"><span id="toast-icon"></span><span id="toast-msg"></span></div>
  <div class="tt-desc" id="tt-desc"></div>
  <div class="quit-modal hidden" id="quit-modal"><div class="quit-dialog"><p>确定退出 PromptFloater？</p><div class="quit-btns"><button class="quit-btn-no" id="quit-no">取消</button><button class="quit-btn-yes" id="quit-yes">退出</button></div></div></div>
  <script src="renderer/app.js"></script>
</body>
</html>
