<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PromptFloater Command Deck preview</title>
  <desc id="desc">A dark command deck style desktop prompt launcher interface with lime highlights.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="16%" r="70%">
      <stop offset="0%" stop-color="#D6FF62" stop-opacity="0.22"/>
      <stop offset="42%" stop-color="#59E0B8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050607" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#171A1D"/>
      <stop offset="100%" stop-color="#090B0D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="#050607"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
